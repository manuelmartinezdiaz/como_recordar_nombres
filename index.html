<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Método para Recordar Nombres - Mobile Mini-App</title>
  
  <!-- Chosen Palette: Warm Cream (#FAF7F2), Slate Navy (#1E293B), and Amber Gold (#D97706) Accents -->
  <!-- Application Structure Plan: Mobile-first SPA structured like a native iOS/Android application. Main content area with bottom fixed navigation menu (Bottom Tab Bar) containing 4 primary modules: 1. Diagnóstico de Memoria, 2. Generador de Anclas, 3. Entrenador Flash, 4. Bóveda Mnemotécnica. Bottom padding ensures full scrollability without content overlap. Persistent LocalStorage keeps track of streak, vault items, and memory profile. -->
  <!-- Visualization & Content Choices: Interactive flashcards, dynamic mnemonic generator, quiz profiling, native bottom tab navigation bar. Powered by Tailwind CSS and Lucide React icons. NO SVG graphics or Mermaid JS used. -->
  <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Babel Standalone for React JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- ESM Importmap -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "lucide-react": "https://esm.sh/lucide-react@0.263.1"
    }
  }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #FAF7F2;
      color: #1E293B;
      -webkit-tap-highlight-color: transparent;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #FAF7F2;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 9999px;
    }

    /* Safe area padding for mobile notches */
    .pb-safe-bottom {
      padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
    }
  </style>
</head>
<body class="antialiased min-h-screen bg-stone-100/60 text-slate-800">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      Brain, Sparkles, Target, Zap, Award, RotateCcw, 
      Trash2, Search, Play, Flame, ShieldCheck, Bookmark, 
      ArrowRight, RefreshCw, Clock, Check
    } from 'lucide-react';

    // Preset seed contacts for vault
    const INITIAL_VAULT = [
      {
        id: '1',
        name: 'Carlos',
        feature: 'Lentes redondos y sonrisa grande',
        context: 'Conferencia de Innovación',
        anchorSymbol: 'Carta / Carro de Carreras',
        visualScene: 'Imagina a Carlos conduciendo un CARRO de carreras gigante que rompe sus LENTES REDONDOS en mil pedazos de neón.',
        masteryLevel: 2,
        createdAt: '2026-03-01'
      },
      {
        id: '2',
        name: 'Lucía',
        feature: 'Cabello rizado pelirrojo',
        context: 'Reunión de Negocios',
        anchorSymbol: 'Luz / Luciérnaga',
        visualScene: 'Visualiza a Lucía encendiendo una LUZ brillante en su cabello rizado como si fuera una LUCIÉRNAGA gigante.',
        masteryLevel: 1,
        createdAt: '2026-03-04'
      }
    ];

    // Quiz Questions Data
    const QUIZ_QUESTIONS = [
      {
        id: 1,
        question: "Cuando te presentan a alguien en un evento social o reunión:",
        options: [
          { label: "Estoy pensando en qué voy a decir yo y ni escucho bien el nombre.", profile: "distraido" },
          { label: "Escucho el nombre claramente, pero a los 10 segundos desapareció de mi mente.", profile: "oyente" },
          { label: "Miro fijamente su rostro y vestimenta, pero el nombre no se conecta con nada.", profile: "visual" }
        ]
      },
      {
        id: 2,
        question: "¿Cuál es tu mayor sensación al quedarte en blanco con un nombre?",
        options: [
          { label: "Ansiedad o prisa social por pasar al siguiente tema.", profile: "distraido" },
          { label: "Frustración porque el nombre me suena abstracto o genérico.", profile: "oyente" },
          { label: "Desconexión entre la cara (que sí recuerdo) y la palabra del nombre.", profile: "visual" }
        ]
      },
      {
        id: 3,
        question: "Si ves a un conocido de lejos semanas después:",
        options: [
          { label: "Recuerdo dónde lo vi pero dudo totalmente de su nombre.", profile: "distraido" },
          { label: "Sé con qué letra empieza o cuántas sílabas tiene, pero no el nombre completo.", profile: "oyente" },
          { label: "Recuerdo perfecto su cara y ropa, pero el nombre es un vacío total.", profile: "visual" }
        ]
      },
      {
        id: 4,
        question: "¿Qué haces habitualmente justo después de escuchar un nombre nuevo?",
        options: [
          { label: "Nada, la conversación sigue y me olvido de procesarlo.", profile: "distraido" },
          { label: "Lo repito internamente en mi cabeza como una palabra suelta.", profile: "oyente" },
          { label: "Observo a la persona pero no hago ninguna asociación con imágenes.", profile: "visual" }
        ]
      },
      {
        id: 5,
        question: "¿Cómo funciona mejor tu aprendizaje en general?",
        options: [
          { label: "Necesito estar libre de distracciones y enfocado en una sola cosa.", profile: "distraido" },
          { label: "Necesito explicaciones con lógica, rimas o estructuras de palabras.", profile: "oyente" },
          { label: "Necesito diagramas, colores, historias y gráficos visuales.", profile: "visual" }
        ]
      }
    ];

    // Simulated People for Flash Trainer
    const SIMULATED_PEOPLE = [
      { id: 'p1', name: 'Guillermo', feature: 'Bigote espeso y traje gris', color: 'bg-amber-500', icon: '👔', hint: 'Guille -> Guitarrón gigante' },
      { id: 'p2', name: 'Ana', feature: 'Lentes rojos y chaqueta azul', color: 'bg-indigo-500', icon: '👓', hint: 'Ana -> Ancla dorada' },
      { id: 'p3', name: 'David', feature: 'Barba corta y gorra deportiva', color: 'bg-emerald-500', icon: '🧢', hint: 'David -> Dado gigante' },
      { id: 'p4', name: 'Elena', feature: 'Sonrisa amplia y collar de perlas', color: 'bg-rose-500', icon: '✨', hint: 'Elena -> Elefante rosado' },
      { id: 'p5', name: 'Jorge', feature: 'Alto con cabello rizado', color: 'bg-cyan-500', icon: '🏀', hint: 'Jorge -> Jarra de agua' }
    ];

    // Mnemonic Anchor Generators
    const MNEMONIC_DICTIONARY = {
      'carlos': { symbol: 'Carta / Carro', prompt: 'un CARRO de carreras o una CARTA del rey' },
      'ana': { symbol: 'Ancla / Anillo', prompt: 'un ANCLA gigante de barco' },
      'david': { symbol: 'Dado / Dardo', prompt: 'un DADO gigante de casino' },
      'lucia': { symbol: 'Luz / Luciérnaga', prompt: 'una LUZ de neón brillante' },
      'jorge': { symbol: 'Jarra / Joya', prompt: 'una JARRA de cristal derramando fuego' },
      'guillermo': { symbol: 'Guitarra / Guiño', prompt: 'una GUITARRA eléctrica explotando' },
      'elena': { symbol: 'Elefante / Helado', prompt: 'un ELEFANTE rosado gigante' },
      'maria': { symbol: 'Mar / Mariposa', prompt: 'el MAR golpeando con olas de colores' },
      'roberto': { symbol: 'Robot / Roble', prompt: 'un ROBOT de acero bailando' },
      'patricia': { symbol: 'Pato / Patín', prompt: 'un PATO gigante con patines de ruedas' }
    };

    function App() {
      // LocalStorage States
      const [vault, setVault] = useState(() => {
        const saved = localStorage.getItem('mnemo_vault');
        return saved ? JSON.parse(saved) : INITIAL_VAULT;
      });

      const [profile, setProfile] = useState(() => {
        const saved = localStorage.getItem('mnemo_profile');
        return saved ? JSON.parse(saved) : null;
      });

      const [stats, setStats] = useState(() => {
        const saved = localStorage.getItem('mnemo_stats');
        return saved ? JSON.parse(saved) : { streak: 3, totalPracticed: 12, masteryRate: 85 };
      });

      // Navigation: quiz, anchor, trainer, vault
      const [activeTab, setActiveTab] = useState('quiz');

      // Anchor Generator Form State
      const [inputName, setInputName] = useState('');
      const [inputFeature, setInputFeature] = useState('');
      const [inputContext, setInputContext] = useState('');
      const [generatedAnchor, setGeneratedAnchor] = useState(null);

      // Flash Trainer State
      const [trainerState, setTrainerState] = useState('idle'); // idle, memorizing, testing, results
      const [trainerPeople, setTrainerPeople] = useState([]);
      const [trainerIndex, setTrainerIndex] = useState(0);
      const [trainerUserAnswers, setTrainerUserAnswers] = useState({});
      const [trainerScore, setTrainerScore] = useState(0);
      const [memorizeTimer, setMemorizeTimer] = useState(12);

      // Quiz State
      const [quizAnswers, setQuizAnswers] = useState({});
      const [currentQuestion, setCurrentQuestion] = useState(0);

      // Vault Search State
      const [searchTerm, setSearchTerm] = useState('');

      // Save to LocalStorage
      useEffect(() => {
        localStorage.getItem('mnemo_vault') && localStorage.setItem('mnemo_vault', JSON.stringify(vault));
      }, [vault]);

      useEffect(() => {
        localStorage.setItem('mnemo_profile', JSON.stringify(profile));
      }, [profile]);

      useEffect(() => {
        localStorage.setItem('mnemo_stats', JSON.stringify(stats));
      }, [stats]);

      // Timer Effect for Flash Trainer
      useEffect(() => {
        let timer = null;
        if (trainerState === 'memorizing' && memorizeTimer > 0) {
          timer = setInterval(() => {
            setMemorizeTimer(prev => prev - 1);
          }, 1000);
        } else if (trainerState === 'memorizing' && memorizeTimer === 0) {
          setTrainerState('testing');
        }
        return () => clearInterval(timer);
      }, [trainerState, memorizeTimer]);

      // Anchor Generator Handler
      const handleGenerateAnchor = (e) => {
        e.preventDefault();
        if (!inputName.trim()) return;

        const cleanName = inputName.trim().toLowerCase();
        const feature = inputFeature.trim() || 'Rostro sonriente / Mirada atenta';
        const context = inputContext.trim() || 'Encuentro casual';

        let symbol = 'Objeto brillante con la primera letra';
        let visualScene = '';

        if (MNEMONIC_DICTIONARY[cleanName]) {
          symbol = MNEMONIC_DICTIONARY[cleanName].symbol;
          visualScene = `Visualiza a ${inputName} sosteniendo ${MNEMONIC_DICTIONARY[cleanName].prompt} que impacta directamente sobre su rasgo de (${feature}) mientras están en ${context}.`;
        } else {
          const firstLetter = inputName.charAt(0).toUpperCase();
          symbol = `Objeto Mnemotécnico con '${firstLetter}'`;
          visualScene = `Crea un choque absurdo: Imagina a ${inputName} interactuando con un objeto gigante con la letra '${firstLetter}' chocando contra sus (${feature}) en medio de ${context}.`;
        }

        setGeneratedAnchor({
          name: inputName.trim(),
          feature,
          context,
          anchorSymbol: symbol,
          visualScene
        });
      };

      const handleSaveGeneratedToVault = () => {
        if (!generatedAnchor) return;
        const newContact = {
          id: Date.now().toString(),
          name: generatedAnchor.name,
          feature: generatedAnchor.feature,
          context: generatedAnchor.context,
          anchorSymbol: generatedAnchor.anchorSymbol,
          visualScene: generatedAnchor.visualScene,
          masteryLevel: 1,
          createdAt: new Date().toISOString().split('T')[0]
        };
        setVault([newContact, ...vault]);
        setGeneratedAnchor(null);
        setInputName('');
        setInputFeature('');
        setInputContext('');
        setActiveTab('vault');
      };

      // Quiz Handler
      const handleSelectQuizAnswer = (profileType) => {
        const updated = { ...quizAnswers, [currentQuestion]: profileType };
        setQuizAnswers(updated);

        if (currentQuestion < QUIZ_QUESTIONS.length - 1) {
          setCurrentQuestion(prev => prev + 1);
        } else {
          // Calculate Profile
          const counts = { distraido: 0, oyente: 0, visual: 0 };
          Object.values(updated).forEach(p => counts[p] = (counts[p] || 0) + 1);
          
          let dominant = 'distraido';
          if (counts.oyente > counts.distraido && counts.oyente >= counts.visual) dominant = 'oyente';
          if (counts.visual > counts.distraido && counts.visual > counts.oyente) dominant = 'visual';

          const profileData = {
            type: dominant,
            title: dominant === 'distraido' ? 'El Distraído Social' : dominant === 'oyente' ? 'El Oyente Pasivo' : 'El Sobrecargado Visual',
            badgeColor: dominant === 'distraido' ? 'bg-amber-100 text-amber-800 border-amber-300' : dominant === 'oyente' ? 'bg-indigo-100 text-indigo-800 border-indigo-300' : 'bg-emerald-100 text-emerald-800 border-emerald-300',
            vulnerability: dominant === 'distraido' ? 'Tu atención se disipa en la prisa o ansiedad inicial de saludar.' : dominant === 'oyente' ? 'Escuchas la palabra del nombre pero no la traduces en una imagen mental.' : 'Tu cerebro graba la cara en HD pero deja el nombre como un archivo sin etiqueta.',
            solutionSteps: dominant === 'distraido' 
              ? ['1. Aplica la Pausa de 3 Segundos al hacer contacto visual.', '2. Repite el nombre en voz alta inmediatamente ("Mucho gusto, Carlos").', '3. Ancla el rasgo principal antes de responder.']
              : dominant === 'oyente'
              ? ['1. Convierte el nombre en una imagen tangible (Carlos = Carro).', '2. Exagera el objeto en movimiento absurdo.', '3. Engancha el objeto con una facción de su rostro.']
              : ['1. No mires solo el rostro; busca UN solo rasgo distintivo (lentes, barba, peinado).', '2. Proyecta la escena absurda directamente sobre ese rasgo.', '3. Revisa la bóveda a las 24 horas para fijar el recuerdo.']
          };

          setProfile(profileData);
        }
      };

      const handleResetQuiz = () => {
        setQuizAnswers({});
        setCurrentQuestion(0);
        setProfile(null);
      };

      // Flash Trainer Handlers
      const handleStartTrainer = () => {
        const shuffled = [...SIMULATED_PEOPLE].sort(() => 0.5 - Math.random()).slice(0, 3);
        setTrainerPeople(shuffled);
        setTrainerIndex(0);
        setTrainerUserAnswers({});
        setTrainerScore(0);
        setMemorizeTimer(12);
        setTrainerState('memorizing');
      };

      const handleTrainerAnswerSubmit = (selectedName) => {
        const currentPerson = trainerPeople[trainerIndex];
        const isCorrect = selectedName.toLowerCase() === currentPerson.name.toLowerCase();
        
        const newAnswers = { ...trainerUserAnswers, [currentPerson.id]: selectedName };
        setTrainerUserAnswers(newAnswers);

        if (isCorrect) {
          setTrainerScore(prev => prev + 1);
        }

        if (trainerIndex < trainerPeople.length - 1) {
          setTrainerIndex(prev => prev + 1);
        } else {
          setTrainerState('results');
          setStats(prev => ({
            ...prev,
            totalPracticed: prev.totalPracticed + trainerPeople.length,
            streak: prev.streak + 1
          }));
        }
      };

      // Vault Filtered List
      const filteredVault = useMemo(() => {
        return vault.filter(item => 
          item.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
          item.feature.toLowerCase().includes(searchTerm.toLowerCase()) ||
          item.context.toLowerCase().includes(searchTerm.toLowerCase())
        );
      }, [vault, searchTerm]);

      // Vault Item Mastery Toggle
      const handleToggleMastery = (id) => {
        setVault(vault.map(item => {
          if (item.id === id) {
            const nextLevel = item.masteryLevel >= 3 ? 1 : item.masteryLevel + 1;
            return { ...item, masteryLevel: nextLevel };
          }
          return item;
        }));
      };

      const handleDeleteVaultItem = (id) => {
        setVault(vault.filter(item => item.id !== id));
      };

      return (
        <div className="max-w-xl mx-auto px-4 pt-4 pb-28 min-h-screen flex flex-col justify-between">
          
          <div className="space-y-5">
            {/* Top Mobile Header Banner */}
            <header className="bg-white rounded-2xl p-4 shadow-sm border border-stone-200 flex items-center justify-between gap-3">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 bg-amber-500 rounded-xl flex items-center justify-center text-white shadow-sm flex-shrink-0">
                  <Brain className="w-5 h-5" />
                </div>
                <div>
                  <h1 className="text-sm font-extrabold text-slate-900 tracking-tight leading-tight">
                    RECORDAR NOMBRES
                  </h1>
                  <p className="text-[11px] text-slate-500 font-medium">
                    Método Mnemotécnico Social
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <div className="flex items-center space-x-1 bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-lg">
                  <Flame className="w-3.5 h-3.5 text-amber-500 fill-amber-500" />
                  <span className="text-xs font-extrabold text-amber-900">{stats.streak}d</span>
                </div>

                <div className="flex items-center space-x-1 bg-slate-50 border border-slate-200 px-2.5 py-1 rounded-lg">
                  <Bookmark className="w-3.5 h-3.5 text-indigo-600" />
                  <span className="text-xs font-extrabold text-slate-900">{vault.length}</span>
                </div>
              </div>
            </header>

            {/* TAB 1: DIAGNÓSTICO DE MEMORIA SOCIAL */}
            {activeTab === 'quiz' && (
              <div className="bg-white rounded-2xl p-5 md:p-6 border border-stone-200 shadow-sm space-y-5 animate-fade-in">
                {!profile ? (
                  <div className="space-y-5">
                    <div className="flex items-center justify-between border-b border-stone-100 pb-3">
                      <div>
                        <span className="text-[10px] font-bold text-amber-600 uppercase tracking-wider block">
                          Paso 1: Diagnóstico
                        </span>
                        <h2 className="text-base font-bold text-slate-900">
                          Identifica tu Bloqueo Mental
                        </h2>
                      </div>
                      <span className="text-[10px] font-bold text-slate-400 bg-stone-100 px-2.5 py-1 rounded-full">
                        {currentQuestion + 1} / {QUIZ_QUESTIONS.length}
                      </span>
                    </div>

                    <div className="space-y-4">
                      <h3 className="text-xs md:text-sm font-semibold text-slate-800 leading-snug">
                        {QUIZ_QUESTIONS[currentQuestion].question}
                      </h3>

                      <div className="space-y-2.5">
                        {QUIZ_QUESTIONS[currentQuestion].options.map((option, idx) => (
                          <button
                            key={idx}
                            onClick={() => handleSelectQuizAnswer(option.profile)}
                            className="w-full text-left p-3.5 rounded-xl border border-stone-200 hover:border-amber-500 hover:bg-amber-50/50 transition-all text-xs font-medium text-slate-700 flex items-center justify-between group active:scale-[0.99]"
                          >
                            <span className="pr-2">{option.label}</span>
                            <ArrowRight className="w-4 h-4 text-stone-300 group-hover:text-amber-600 transition-all flex-shrink-0" />
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-5">
                    <div className="bg-amber-50/80 border border-amber-200 rounded-2xl p-4 space-y-3">
                      <div className="flex items-center justify-between">
                        <span className={`text-[10px] font-extrabold uppercase px-2.5 py-0.5 rounded-full border ${profile.badgeColor}`}>
                          Perfil: {profile.title}
                        </span>
                        <button
                          onClick={handleResetQuiz}
                          className="text-[11px] font-bold text-slate-500 hover:text-slate-800 flex items-center gap-1"
                        >
                          <RotateCcw className="w-3 h-3" /> Reiniciar
                        </button>
                      </div>

                      <div className="space-y-1">
                        <h3 className="text-xs font-bold text-slate-900">
                          Tu Punto Ciego Principal:
                        </h3>
                        <p className="text-xs text-slate-700 leading-relaxed">
                          {profile.vulnerability}
                        </p>
                      </div>
                    </div>

                    <div className="space-y-2.5">
                      <h4 className="text-xs font-bold text-slate-900 uppercase tracking-wider flex items-center gap-1.5">
                        <ShieldCheck className="w-4 h-4 text-emerald-600" /> Protocolo Recomendado:
                      </h4>

                      <div className="space-y-2">
                        {profile.solutionSteps.map((step, idx) => (
                          <div key={idx} className="p-3 bg-stone-50 border border-stone-200 rounded-xl text-xs text-slate-700 space-y-0.5">
                            <span className="font-bold text-amber-700 block">{step.split('.')[0]}</span>
                            <p>{step.split('.').slice(1).join('.')}</p>
                          </div>
                        ))}
                      </div>
                    </div>

                    <button
                      onClick={() => setActiveTab('anchor')}
                      className="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs rounded-xl transition-all shadow-sm flex items-center justify-center gap-2"
                    >
                      Ir al Generador de Anclas <ArrowRight className="w-4 h-4" />
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* TAB 2: GENERADOR DE ANCLAS MNEMOTÉCNICAS */}
            {activeTab === 'anchor' && (
              <div className="bg-white rounded-2xl p-5 md:p-6 border border-stone-200 shadow-sm space-y-5 animate-fade-in">
                <div>
                  <span className="text-[10px] font-bold text-indigo-600 uppercase tracking-wider block">
                    Paso 2: Transformador
                  </span>
                  <h2 className="text-base font-bold text-slate-900">
                    Generador de Anclas Visuales
                  </h2>
                  <p className="text-xs text-slate-500 mt-0.5">
                    Crea una imagen absurda e imborrable para cualquier nombre.
                  </p>
                </div>

                <form onSubmit={handleGenerateAnchor} className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">
                      Nombre de la Persona *
                    </label>
                    <input
                      type="text"
                      placeholder="Ej: Carlos, Ana, Lucía..."
                      value={inputName}
                      onChange={(e) => setInputName(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-stone-50/50"
                      required
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2.5">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">
                        Rasgo Físico
                      </label>
                      <input
                        type="text"
                        placeholder="Ej: Lentes, barba..."
                        value={inputFeature}
                        onChange={(e) => setInputFeature(e.target.value)}
                        className="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-stone-50/50"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">
                        Lugar / Contexto
                      </label>
                      <input
                        type="text"
                        placeholder="Ej: Evento, gym..."
                        value={inputContext}
                        onChange={(e) => setInputContext(e.target.value)}
                        className="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-stone-50/50"
                      />
                    </div>
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-sm transition-all flex items-center justify-center gap-2 active:scale-[0.99]"
                  >
                    <Sparkles className="w-4 h-4" /> Construir Ancla Mental
                  </button>
                </form>

                {generatedAnchor && (
                  <div className="bg-indigo-50/80 border border-indigo-200 rounded-2xl p-4 space-y-3">
                    <div className="flex items-center justify-between border-b border-indigo-100 pb-2">
                      <div className="flex items-center space-x-1.5">
                        <Zap className="w-4 h-4 text-indigo-600" />
                        <h3 className="font-bold text-slate-900 text-xs">
                          Ancla para: {generatedAnchor.name}
                        </h3>
                      </div>
                      <span className="text-[9px] font-extrabold bg-indigo-200 text-indigo-900 px-2 py-0.5 rounded-full uppercase">
                        Símbolo: {generatedAnchor.anchorSymbol}
                      </span>
                    </div>

                    <div className="space-y-1">
                      <span className="text-[10px] font-bold text-indigo-900 uppercase tracking-wider block">
                        🎬 Película Mental (Visualízala 3 Segundos):
                      </span>
                      <p className="text-xs text-slate-800 bg-white p-3 rounded-xl border border-indigo-100 leading-relaxed font-medium">
                        "{generatedAnchor.visualScene}"
                      </p>
                    </div>

                    <button
                      onClick={handleSaveGeneratedToVault}
                      className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-1.5 shadow-sm"
                    >
                      <Bookmark className="w-4 h-4" /> Guardar en Bóveda
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* TAB 3: ENTRENADOR DE MEMORIA FLASH */}
            {activeTab === 'trainer' && (
              <div className="bg-white rounded-2xl p-5 md:p-6 border border-stone-200 shadow-sm space-y-5 animate-fade-in">
                <div className="flex items-center justify-between border-b border-stone-100 pb-3">
                  <div>
                    <span className="text-[10px] font-bold text-emerald-600 uppercase tracking-wider block">
                      Paso 3: Gimnasio Mental
                    </span>
                    <h2 className="text-base font-bold text-slate-900">
                      Entrenador Flash
                    </h2>
                  </div>

                  {trainerState !== 'idle' && (
                    <button
                      onClick={() => setTrainerState('idle')}
                      className="text-xs text-slate-400 hover:text-slate-600 font-bold flex items-center gap-1"
                    >
                      <RotateCcw className="w-3.5 h-3.5" /> Salir
                    </button>
                  )}
                </div>

                {/* IDLE STATE */}
                {trainerState === 'idle' && (
                  <div className="text-center py-6 space-y-4">
                    <div className="w-14 h-14 bg-emerald-100 rounded-2xl flex items-center justify-center text-emerald-600 mx-auto">
                      <Award className="w-7 h-7" />
                    </div>
                    <div className="space-y-1">
                      <h3 className="font-bold text-slate-900 text-sm">
                        Simulador de Presión Social
                      </h3>
                      <p className="text-xs text-slate-500 max-w-xs mx-auto">
                        Te mostraremos 3 personas con sus anclas durante 12 segundos. ¿Serás capaz de recordarlos?
                      </p>
                    </div>
                    <button
                      onClick={handleStartTrainer}
                      className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-md transition-all flex items-center justify-center gap-2 active:scale-[0.99]"
                    >
                      <Play className="w-4 h-4 fill-white" /> Iniciar Ronda Rapida
                    </button>
                  </div>
                )}

                {/* MEMORIZING STATE */}
                {trainerState === 'memorizing' && (
                  <div className="space-y-4">
                    <div className="flex items-center justify-between bg-amber-50 px-3.5 py-2.5 rounded-xl border border-amber-200">
                      <div className="flex items-center space-x-2">
                        <Clock className="w-4 h-4 text-amber-600 animate-pulse" />
                        <span className="text-xs font-bold text-amber-900">
                          Memoriza las Anclas
                        </span>
                      </div>
                      <span className="text-lg font-black font-mono text-amber-700">
                        {memorizeTimer}s
                      </span>
                    </div>

                    <div className="grid grid-cols-1 gap-2.5">
                      {trainerPeople.map((person) => (
                        <div key={person.id} className="p-3 bg-stone-50 border border-stone-200 rounded-xl flex items-center space-x-3">
                          <div className={`w-10 h-10 ${person.color} text-white rounded-xl flex items-center justify-center text-lg shadow-sm flex-shrink-0`}>
                            {person.icon}
                          </div>
                          <div className="flex-grow">
                            <h4 className="font-bold text-slate-900 text-xs">{person.name}</h4>
                            <span className="text-[11px] text-slate-500 block">{person.feature}</span>
                          </div>
                          <span className="text-[10px] font-bold text-indigo-700 bg-white px-2 py-1 rounded-lg border border-stone-200">
                            {person.hint}
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* TESTING STATE */}
                {trainerState === 'testing' && (
                  <div className="space-y-4">
                    <div className="text-center space-y-0.5">
                      <span className="text-[10px] font-extrabold text-indigo-600 uppercase">
                        Pregunta {trainerIndex + 1} de {trainerPeople.length}
                      </span>
                      <h3 className="text-sm font-bold text-slate-900">
                        ¿Cuál es el nombre de esta persona?
                      </h3>
                    </div>

                    <div className="p-4 bg-stone-50 border border-stone-200 rounded-2xl text-center space-y-2">
                      <div className={`w-14 h-14 ${trainerPeople[trainerIndex].color} text-white rounded-2xl flex items-center justify-center text-2xl mx-auto shadow-sm`}>
                        {trainerPeople[trainerIndex].icon}
                      </div>
                      <div>
                        <span className="text-[10px] font-bold text-slate-400 block uppercase">Rasgo Distintivo</span>
                        <p className="text-xs font-bold text-slate-800">{trainerPeople[trainerIndex].feature}</p>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 gap-2">
                      {SIMULATED_PEOPLE.map((p) => (
                        <button
                          key={p.id}
                          onClick={() => handleTrainerAnswerSubmit(p.name)}
                          className="w-full py-2.5 px-3.5 rounded-xl border border-stone-200 hover:border-emerald-500 hover:bg-emerald-50 text-xs font-bold text-slate-800 transition-all flex items-center justify-between active:scale-[0.99]"
                        >
                          <span>{p.name}</span>
                          <ArrowRight className="w-3.5 h-3.5 text-stone-300" />
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {/* RESULTS STATE */}
                {trainerState === 'results' && (
                  <div className="text-center py-4 space-y-4">
                    <div className="w-14 h-14 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center mx-auto">
                      <Sparkles className="w-7 h-7" />
                    </div>

                    <div className="space-y-1">
                      <h3 className="text-lg font-bold text-slate-900">
                        ¡Ronda Completada!
                      </h3>
                      <p className="text-xs text-slate-500">
                        Acertaste <span className="font-bold text-emerald-600 text-sm">{trainerScore}</span> de <span className="font-bold text-slate-800">{trainerPeople.length}</span> nombres.
                      </p>
                    </div>

                    <button
                      onClick={handleStartTrainer}
                      className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-sm transition-all flex items-center justify-center gap-2 active:scale-[0.99]"
                    >
                      <RefreshCw className="w-4 h-4" /> Entrenar Otra Ronda
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* TAB 4: BÓVEDA DE NOMBRES */}
            {activeTab === 'vault' && (
              <div className="bg-white rounded-2xl p-5 md:p-6 border border-stone-200 shadow-sm space-y-4 animate-fade-in">
                <div className="space-y-3">
                  <div>
                    <span className="text-[10px] font-bold text-rose-600 uppercase tracking-wider block">
                      Paso 4: Repetición Espaciada
                    </span>
                    <h2 className="text-base font-bold text-slate-900">
                      Bóveda de Contactos ({filteredVault.length})
                    </h2>
                  </div>

                  <div className="relative">
                    <Search className="w-3.5 h-3.5 text-stone-400 absolute left-3 top-3" />
                    <input
                      type="text"
                      placeholder="Buscar persona o rasgo..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="pl-8 pr-3 py-2 rounded-xl border border-stone-200 text-xs focus:outline-none focus:ring-2 focus:ring-rose-500 w-full bg-stone-50/50"
                    />
                  </div>
                </div>

                {filteredVault.length > 0 ? (
                  <div className="space-y-3">
                    {filteredVault.map((item) => (
                      <div key={item.id} className="p-4 rounded-xl border border-stone-200 bg-stone-50/50 space-y-2.5">
                        <div className="flex items-start justify-between">
                          <div>
                            <h3 className="font-extrabold text-slate-900 text-sm">{item.name}</h3>
                            <span className="text-[10px] font-semibold text-slate-400 block">{item.context}</span>
                          </div>

                          <button
                            onClick={() => handleToggleMastery(item.id)}
                            className={`text-[9px] font-bold px-2 py-0.5 rounded-full border ${
                              item.masteryLevel >= 3 
                                ? 'bg-emerald-100 text-emerald-800 border-emerald-300' 
                                : item.masteryLevel === 2 
                                  ? 'bg-amber-100 text-amber-800 border-amber-300' 
                                  : 'bg-stone-100 text-slate-600 border-stone-300'
                            }`}
                          >
                            {item.masteryLevel >= 3 ? 'Dominado ✨' : item.masteryLevel === 2 ? 'En Repaso 🟡' : 'Nuevo 🔵'}
                          </button>
                        </div>

                        <div className="bg-white p-2.5 rounded-lg border border-stone-200 space-y-0.5 text-xs">
                          <span className="font-bold text-slate-700 block text-[11px]">Rasgo: {item.feature}</span>
                          <p className="text-slate-600 text-[11px] leading-relaxed italic">
                            "{item.visualScene}"
                          </p>
                        </div>

                        <div className="flex items-center justify-between text-[10px] text-slate-400 pt-1">
                          <span>Símbolo: {item.anchorSymbol}</span>
                          <button
                            onClick={() => handleDeleteVaultItem(item.id)}
                            className="text-stone-300 hover:text-rose-500 p-1"
                          >
                            <Trash2 className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="text-center py-8 bg-stone-50 rounded-xl border border-stone-200 text-slate-400 space-y-1">
                    <Bookmark className="w-6 h-6 mx-auto text-stone-300" />
                    <p className="text-xs font-medium">No hay contactos guardados en la bóveda.</p>
                  </div>
                )}
              </div>
            )}
          </div>

          {/* FIXED MOBILE BOTTOM NAVIGATION BAR */}
          <nav className="fixed bottom-0 left-0 right-0 z-50 bg-white/95 backdrop-blur-md border-t border-stone-200 shadow-lg px-2 py-2 pb-safe-bottom">
            <div className="max-w-md mx-auto grid grid-cols-4 gap-1">
              
              {/* TAB 1: DIAGNÓSTICO */}
              <button
                onClick={() => setActiveTab('quiz')}
                className={`flex flex-col items-center justify-center py-1.5 px-1 rounded-xl transition-all ${
                  activeTab === 'quiz' 
                    ? 'text-amber-600 font-extrabold bg-amber-50/80 scale-105' 
                    : 'text-slate-400 hover:text-slate-600 font-medium'
                }`}
              >
                <Target className="w-5 h-5 mb-0.5" />
                <span className="text-[10px] leading-tight">Diagnóstico</span>
              </button>

              {/* TAB 2: ANCLAJE */}
              <button
                onClick={() => setActiveTab('anchor')}
                className={`flex flex-col items-center justify-center py-1.5 px-1 rounded-xl transition-all ${
                  activeTab === 'anchor' 
                    ? 'text-indigo-600 font-extrabold bg-indigo-50/80 scale-105' 
                    : 'text-slate-400 hover:text-slate-600 font-medium'
                }`}
              >
                <Zap className="w-5 h-5 mb-0.5" />
                <span className="text-[10px] leading-tight">Anclaje</span>
              </button>

              {/* TAB 3: ENTRENADOR */}
              <button
                onClick={() => setActiveTab('trainer')}
                className={`flex flex-col items-center justify-center py-1.5 px-1 rounded-xl transition-all ${
                  activeTab === 'trainer' 
                    ? 'text-emerald-600 font-extrabold bg-emerald-50/80 scale-105' 
                    : 'text-slate-400 hover:text-slate-600 font-medium'
                }`}
              >
                <Award className="w-5 h-5 mb-0.5" />
                <span className="text-[10px] leading-tight">Entrenador</span>
              </button>

              {/* TAB 4: BÓVEDA */}
              <button
                onClick={() => setActiveTab('vault')}
                className={`flex flex-col items-center justify-center py-1.5 px-1 rounded-xl transition-all relative ${
                  activeTab === 'vault' 
                    ? 'text-rose-600 font-extrabold bg-rose-50/80 scale-105' 
                    : 'text-slate-400 hover:text-slate-600 font-medium'
                }`}
              >
                <Bookmark className="w-5 h-5 mb-0.5" />
                <span className="text-[10px] leading-tight">Bóveda</span>
                {vault.length > 0 && (
                  <span className="absolute top-1 right-3 w-2 h-2 bg-rose-500 rounded-full"></span>
                )}
              </button>

            </div>
          </nav>

        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
